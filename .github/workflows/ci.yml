name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: lint + deterministic eval
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Sync environment (from lockfile)
        run: uv sync --frozen

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Format check (ruff)
        run: uv run ruff format --check .

      - name: Unit tests (pytest)
        run: uv run pytest -q

      # The LLM legs (extraction + judge) are billed and need an API key, so
      # CI runs only the free, deterministic path: regenerate the synthetic
      # invoices and score the anomaly rules against the injected labels.
      - name: Deterministic eval (no API key)
        run: |
          uv run python scripts/generate_invoices.py
          uv run python -m eval.harness --no-llm

      # Replays the full extraction + judge legs from the committed cache with
      # no API key. Exercises the real pipeline (provider import, agent
      # construction, metrics) offline, and reproduces the report's numbers.
      - name: Full eval via replay cache (no API key)
        run: uv run python -m eval.harness --replay
